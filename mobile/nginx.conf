server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # manifest.json and the service worker must never be served stale, or a
    # PWA update (a new claim/inactivity behavior, say) can silently fail to
    # reach installed vendor phones.
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
