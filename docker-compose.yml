services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: zitadel
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zitadel v4 split its login UI out into a separate service ("Login V2",
  # a Next.js app - see zitadel-login below); the zitadel-api container
  # alone does not serve /ui/v2/login/* at all. The official reference
  # compose (github.com/zitadel/zitadel/blob/main/deploy/compose/docker-compose.yml)
  # unifies both under one domain/port via Traefik; we skip Traefik here
  # for local-dev simplicity and just publish both containers on their own
  # ports directly (zitadel-api on 8080, zitadel-login on 3000) - the
  # browser is redirected between them via full URLs, which works fine
  # against localhost even without a shared origin.
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command: >
      start-from-init
      --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://zitadel:${ZITADEL_DB_PASSWORD}@zitadel-db:5432/zitadel?sslmode=disable"
      # ZITADEL_DOMAIN is whatever host the mobile app/browser will reach
      # this stack on: "localhost" for the desktop, or a LAN IP (e.g.
      # 192.168.1.42) when testing from a phone on the same network. Login
      # V2's URLs below must point at the same host, since the browser is
      # redirected there directly (not proxied through zitadel).
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      # Auto-creates the machine user + Personal Access Token that
      # zitadel-login authenticates to the API with, and writes the PAT to
      # the shared zitadel-bootstrap volume for zitadel-login to read.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: "Automatically Initialized IAM_LOGIN_CLIENT"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2039-01-01T00:00:00Z"
      # Forces the v2 login flow (matches what your logs already showed
      # Zitadel defaulting to) and points it at zitadel-login's published
      # port instead of the unset default, which is what 404'd.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "http://${ZITADEL_DOMAIN}:3000/ui/v2/login/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "http://${ZITADEL_DOMAIN}:3000/ui/v2/login/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "http://${ZITADEL_DOMAIN}:3000/ui/v2/login/logout?post_logout_redirect="
    ports:
      - "8080:8080"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    depends_on:
      zitadel-db:
        condition: service_healthy

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:latest
    environment:
      ZITADEL_API_URL: "http://zitadel:8080"
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
    ports:
      - "3000:3000"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI, for viewing sent receipt emails during dev
      - "1025:1025" # SMTP

  scale-gateway:
    build:
      context: ./backend
      dockerfile: services/scale-gateway/Dockerfile
    volumes:
      - ./backend/services/scale-gateway/config.example.json:/etc/scale-gateway/config.json:ro
    command: ["-config", "/etc/scale-gateway/config.json"]
    ports:
      - "8082:8080"

  core-api:
    build:
      context: ./backend
      dockerfile: services/core-api/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      LISTEN_ADDR: ":8081"
      # ZITADEL_ISSUER_URL must match Zitadel's ZITADEL_EXTERNALDOMAIN above
      # exactly (OIDC discovery requires it), while ZITADEL_DISCOVERY_URL is
      # the address core-api actually reaches Zitadel at over the Docker
      # network — these differ whenever ZITADEL_DOMAIN isn't "zitadel"
      # (i.e. always, for any real value), which is exactly the split
      # NewZitadelVerifier's oidc.InsecureIssuerURLContext handles.
      ZITADEL_ISSUER_URL: "http://${ZITADEL_DOMAIN}:8080"
      ZITADEL_DISCOVERY_URL: "http://zitadel:8080"
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE}
      ZITADEL_BASE_URL: "http://zitadel:8080"
      ZITADEL_SERVICE_TOKEN: ${ZITADEL_SERVICE_TOKEN}
      SMTP_ADDR: "mailpit:1025"
      SMTP_FROM: "receipts@scale-app.local"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CURRENCY: ${CURRENCY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel:
        condition: service_healthy

volumes:
  postgres-data:
  zitadel-db-data:
  zitadel-bootstrap:
