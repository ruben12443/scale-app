services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Replaces Zitadel + zitadel-db + zitadel-login: Rauthy is a single
  # self-contained OIDC provider — no separate login-UI service to run
  # alongside it, and no external database, since it persists via its own
  # embedded store (Hiqlite) onto the rauthy-data volume below instead.
  # See mobile/README.md and backend/services/core-api/README.md for how
  # each side integrates, and rauthy-bootstrap/README.md for what the
  # mounted bootstrap files below actually set up.
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.2
    environment:
      LISTEN_SCHEME: "http"
      # RAUTHY_DOMAIN is whatever host the mobile app/browser will reach
      # this stack on: "localhost" for the desktop, or a LAN IP (e.g.
      # 192.168.1.42) when testing from a phone on the same network — the
      # same role ZITADEL_DOMAIN played before. webauthn.rp_id/rp_origin
      # are set even though this stack doesn't use passkey login, since
      # Rauthy expects them regardless.
      PUB_URL: "${RAUTHY_DOMAIN}:8080"
      RP_ID: "${RAUTHY_DOMAIN}"
      RP_ORIGIN: "http://${RAUTHY_DOMAIN}:8080"
      BOOTSTRAP_DIR: "/app/bootstrap"
      BOOTSTRAP_ADMIN_EMAIL: "admin@localhost"
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: "${RAUTHY_ADMIN_PASSWORD}"
      ENC_KEYS: "${RAUTHY_ENC_KEYS}"
      ENC_KEY_ACTIVE: "${RAUTHY_ENC_KEY_ACTIVE}"
      HQL_NODE_ID: "1"
      HQL_SECRET_RAFT: "${RAUTHY_HQL_SECRET}"
      HQL_SECRET_API: "${RAUTHY_HQL_SECRET}"
      SMTP_URL: "mailpit"
      SMTP_PORT: "1025"
      SMTP_DANGER_INSECURE: "true"
      SMTP_FROM: "Rauthy <rauthy@scale-app.local>"
    volumes:
      - rauthy-data:/app/data
      - ./rauthy-bootstrap:/app/bootstrap:ro
    ports:
      - "8080:8080"
    # No healthcheck: Rauthy's image is distroless (no shell, no
    # curl/wget), so a CMD-SHELL probe like the other services use here
    # isn't possible. core-api's depends_on below is start-order only.
    depends_on:
      - mailpit

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI, for viewing sent receipt emails during dev
      - "1025:1025" # SMTP

  scale-gateway:
    build:
      context: ./backend
      dockerfile: services/scale-gateway/Dockerfile
    volumes:
      - ./backend/services/scale-gateway/config.example.json:/etc/scale-gateway/config.json:ro
    command: ["-config", "/etc/scale-gateway/config.json"]
    ports:
      - "8082:8080"

  core-api:
    build:
      context: ./backend
      dockerfile: services/core-api/Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      LISTEN_ADDR: ":8081"
      # RAUTHY_ISSUER_URL must match Rauthy's PUB_URL above exactly (OIDC
      # discovery requires it) plus its /auth/v1 path prefix, while
      # RAUTHY_DISCOVERY_URL is the address core-api actually reaches
      # Rauthy at over the Docker network — these differ whenever
      # RAUTHY_DOMAIN isn't "rauthy" (i.e. always, for any real value),
      # which is exactly the split NewRauthyVerifier's
      # oidc.InsecureIssuerURLContext handles.
      RAUTHY_ISSUER_URL: "http://${RAUTHY_DOMAIN}:8080/auth/v1"
      RAUTHY_DISCOVERY_URL: "http://rauthy:8080/auth/v1"
      RAUTHY_AUDIENCE: "stallhand"
      RAUTHY_BASE_URL: "http://rauthy:8080/auth/v1"
      RAUTHY_API_KEY: "core-api$$${RAUTHY_API_KEY_SECRET}"
      SMTP_ADDR: "mailpit:1025"
      SMTP_FROM: "receipts@scale-app.local"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CURRENCY: ${CURRENCY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rauthy:
        condition: service_started

  # Serves the vendor app as an installable PWA (see mobile/README.md) so a
  # vendor can just visit http://<this host>:8083 on their phone and "Add to
  # Home Screen" — no app store, no sideloading an APK. RAUTHY_DOMAIN
  # doubles here as "whatever host the vendor's phone will reach this stack
  # on", same as it already does for the rauthy service above. The client ID
  # ("stallhand") must match rauthy-bootstrap/clients.json's "id" and
  # core-api's RAUTHY_AUDIENCE above — all three name the same OIDC client.
  mobile-web:
    build:
      context: ./mobile
      args:
        CORE_API_BASE_URL: "http://${RAUTHY_DOMAIN}:8081"
        SCALE_GATEWAY_BASE_URL: "http://${RAUTHY_DOMAIN}:8082"
        RAUTHY_ISSUER: "http://${RAUTHY_DOMAIN}:8080/auth/v1"
        RAUTHY_CLIENT_ID: "stallhand"
    ports:
      - "8083:80"

volumes:
  postgres-data:
  rauthy-data:
